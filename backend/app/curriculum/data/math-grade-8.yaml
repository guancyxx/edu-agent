subject: math
grade: 8
semester: 上册
title: "八年级数学（上册）"
chapters:
  - id: "8-1"
    title: "三角形"
    knowledge_points:
      - id: "8-1-1"
        title: "与三角形有关的线段"
        difficulty: 2
        prerequisites: ["7-4-3"]
        description: "理解三角形的边、高、中线、角平分线"
      - id: "8-1-2"
        title: "与三角形有关的角"
        difficulty: 3
        prerequisites: ["8-1-1"]
        description: "掌握三角形内角和定理及外角性质"
      - id: "8-1-3"
        title: "多边形及其内角和"
        difficulty: 3
        prerequisites: ["8-1-2"]
        description: "理解多边形概念，掌握多边形内角和公式"

  - id: "8-2"
    title: "全等三角形"
    knowledge_points:
      - id: "8-2-1"
        title: "全等三角形"
        difficulty: 3
        prerequisites: ["8-1-2"]
        description: "理解全等三角形的概念和性质"
      - id: "8-2-2"
        title: "三角形全等的判定（SSS, SAS, ASA, AAS）"
        difficulty: 4
        prerequisites: ["8-2-1"]
        description: "掌握三角形全等的四种判定方法"
      - id: "8-2-3"
        title: "直角三角形全等的判定（HL）"
        difficulty: 4
        prerequisites: ["8-2-2"]
        description: "掌握直角三角形全等的斜边直角边判定"

  - id: "8-3"
    title: "轴对称"
    knowledge_points:
      - id: "8-3-1"
        title: "轴对称"
        difficulty: 2
        prerequisites: ["7-4-1"]
        description: "理解轴对称图形和轴对称的概念"
      - id: "8-3-2"
        title: "等腰三角形"
        difficulty: 4
        prerequisites: ["8-3-1", "8-2-2"]
        description: "掌握等腰三角形的性质和判定"

  - id: "8-4"
    title: "整式的乘法与因式分解"
    knowledge_points:
      - id: "8-4-1"
        title: "整式的乘法"
        difficulty: 3
        prerequisites: ["7-2-2"]
        description: "掌握幂的运算性质和整式乘法法则"
      - id: "8-4-2"
        title: "乘法公式"
        difficulty: 3
        prerequisites: ["8-4-1"]
        description: "掌握平方差公式和完全平方公式"
      - id: "8-4-3"
        title: "因式分解"
        difficulty: 4
        prerequisites: ["8-4-2"]
        description: "理解因式分解的概念，掌握提公因式法和公式法"

  - id: "8-5"
    title: "分式"
    knowledge_points:
      - id: "8-5-1"
        title: "从分数到分式"
        difficulty: 3
        prerequisites: ["7-1-4"]
        description: "理解分式的概念和基本性质"
      - id: "8-5-2"
        title: "分式的运算"
        difficulty: 4
        prerequisites: ["8-5-1"]
        description: "掌握分式的乘除、加减运算法则"
      - id: "8-5-3"
        title: "分式方程"
        difficulty: 4
        prerequisites: ["8-5-2", "7-3-4"]
        description: "掌握分式方程的解法及其应用"
